<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Signage</title>
    <style>
        :root {
            --primary: #00b7af;
            --dark: #10181f;
            --light: #ffffff;
            --secondary: #6a7071;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-size: 5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary), #00d4cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
        }

        p {
            font-size: 1.5rem;
            color: var(--secondary);
            font-weight: 300;
        }

        .icon-container {
            margin-bottom: 2rem;
            color: var(--primary);
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Responsive sizing */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            p { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <img src="https://unpkg.com/lucide-static@latest/icons/globe.svg" alt="Globe" width="80" height="80" style="filter: invert(56%) sepia(87%) saturate(1541%) hue-rotate(134deg) brightness(96%) contrast(101%);">
        </div>
        <h1>Hello World</h1>
        <p>Digital Signage Powered by Skoop</p>
    </div>

    <script>
        // Simple script to refresh the page every hour to keep it fresh
        // or add any dynamic behavior if needed in the future.
        console.log("Hello World App Loaded");

        // Auto-refresh every hour (optional for signage)
        setTimeout(() => {
            window.location.reload();
        }, 3600000);
    </script>
</body>
</html>
